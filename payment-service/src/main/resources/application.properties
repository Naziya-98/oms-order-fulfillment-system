spring.application.name=payment-service

server.port=8084

#########################
# Database
#########################

spring.datasource.url=jdbc:postgresql://localhost:5432/paymentdb
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.kafka.bootstrap-servers=localhost:9092

#########################
# Consumer
#########################

spring.kafka.consumer.group-id=payment-group
spring.kafka.consumer.auto-offset-reset=latest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.ikea.oms.paymentservice.event.OrderCreatedEvent

#########################
# Producer
#########################

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.producer.properties.spring.json.add.type.headers=false

#########################
# Payment Gateway Simulation
# (replaces the old "skuCode == FAIL_PAYMENT" hack)
#########################

# How long the simulated gateway "thinks" before responding (ms)
payment.simulation.delay-ms=3000

# Probability (0.0 - 1.0) that the simulated gateway declines the payment.
# Set to 1.0 to force every payment to fail (useful for demoing the
# compensation / Saga rollback flow), or 0.0 to force every payment to succeed.
payment.simulation.failure-rate=0.0

#swagger:
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
